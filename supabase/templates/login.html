<!-- Šablona pro Supabase: Authentication → Emails → Templates → Confirm signup i Magic Link.
     Varianta A (doporučená): velký kód, pod ním tlačítko s odkazem. Předmět: Tvůj kód do GetTogether -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:24px 12px;font-family:Urbanist,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:20px;border:2px solid #f0f0f0;">
        <tr>
          <td style="padding:28px 24px 24px;text-align:center;">
            <img src="https://together.get-up.fun/pwa-icon/192" width="48" height="48" alt="GetTogether" style="display:block;margin:0 auto;border-radius:14px;">
            <p style="margin:14px 0 0;font-size:18px;font-weight:700;color:#f759f5;">GetTogether</p>
            <p style="margin:2px 0 0;font-size:11px;font-weight:700;letter-spacing:3px;color:#9a9ea3;">BY GETUP</p>

            <h1 style="margin:24px 0 6px;font-size:22px;font-weight:800;color:#12151c;">Tvůj kód pro přihlášení</h1>
            <p style="margin:0;font-size:15px;line-height:1.5;color:#616568;">Zadej ho v aplikaci. Platí 60 minut.</p>

            <div style="margin:20px 0 0;padding:16px 8px;border-radius:14px;background:#fae8f9;white-space:nowrap;">
              <a href="#" style="font-size:30px;font-weight:800;letter-spacing:5px;color:#12151c;text-decoration:none;">{{ .Token }}</a>
            </div>

            <p style="margin:24px 0 10px;font-size:14px;color:#9a9ea3;">Nebo se přihlas jedním klepnutím:</p>
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
               style="display:inline-block;padding:13px 28px;border-radius:12px;background:#f759f5;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none;">
              Přihlásit se
            </a>

            <p style="margin:26px 0 0;font-size:12px;line-height:1.5;color:#9a9ea3;">
              Pokud ses nepřihlašoval/a, e-mail klidně ignoruj. Kód nikomu neposílej.
            </p>
          </td>
        </tr>
      </table>
      <p style="margin:18px 0 0;font-size:12px;color:#9a9ea3;">GetTogether by GetUp · <a href="https://together.get-up.fun" style="color:#9a9ea3;">together.get-up.fun</a></p>
    </td>
  </tr>
</table>
