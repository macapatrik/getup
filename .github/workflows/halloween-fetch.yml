# Dočasný workflow (větev tmp/halloween-fetch): stáhne z get-up.fun seznam médií a obrázky log,
# aby šlo najít správné soubory. Z vývojového prostředí je web nedostupný.
name: Halloween fetch

on:
  push:
    branches: [tmp/halloween-fetch]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zvětšená loga z Higgsfieldu
        run: |
          mkdir -p fetch/upscaled
          curl -fsSL -o fetch/upscaled/proud.png "https://d8j0ntlcm91z4.cloudfront.net/user_3Byp0QuDRtgSsewOSg7DwvV38lR/hf_20261003_114612_281fda70-91f4-4c0d-a7e7-8ece52c3a28c.png"
          curl -fsSL -o fetch/upscaled/hqd.png "https://d8j0ntlcm91z4.cloudfront.net/user_3Byp0QuDRtgSsewOSg7DwvV38lR/hf_20261003_114614_0910f9e8-c559-4b7b-8454-25413da90eab.png"
          file fetch/upscaled/*
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fetch
          git commit -m "Halloween: média a loga z webu (workflow)" || echo "nothing to commit"
          git push
