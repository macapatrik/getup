# Dočasný workflow: stáhne vygenerované podklady pro /halloween a commitne je do větve.
name: Fetch Halloween assets

on:
  workflow_dispatch:
  push:
    branches: [claude/exciting-knuth-9lozvp]
    paths:
      - scripts/fetch-halloween-assets.mjs
      - .github/workflows/fetch-halloween-assets.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/fetch-halloween-assets.mjs
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/halloween/gen
          git commit -m "Halloween: vygenerované podklady (hero, reaper, titulek, dav)" || echo "nothing to commit"
          git push
